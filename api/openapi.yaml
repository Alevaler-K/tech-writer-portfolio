openapi: 3.0.3
info:
  title: API Сервиса Корзины и Заказов
  description: Документация API для управления корзиной покупателя и оформления заказов в интернет-магазине.
  version: 1.0.0

servers:
  - url: https://api.mystore.ru/v1
    description: Production сервер

security:
  - bearerAuth: []

paths:
  /cart/items:
    post:
      summary: Добавление товара в корзину
      description: Добавляет указанное количество товара в корзину текущего пользователя. Если товар уже там есть, увеличивает его количество.
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - quantity
              properties:
                productId:
                  type: string
                  example: "prod_987654"
                  description: Уникальный идентификатор товара (SKU).
                quantity:
                  type: integer
                  minimum: 1
                  example: 2
                  description: Количество товара для добавления.
      responses:
        '200':
          description: Товар успешно добавлен в корзину.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cartId:
                    type: string
                    example: "cart_12345"
                  totalItems:
                    type: integer
                    example: 3
                  totalPrice:
                    type: integer
                    description: Итоговая стоимость корзины в копейках.
                    example: 299000
        '400':
          description: Ошибка валидации (например, неверный формат ID или отрицательное количество).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован (требуется Bearer Token).

  /orders:
    post:
      summary: Создание заказа
      description: |
        Создает новый заказ на основе текущей корзины пользователя и выбранного адреса доставки.
        После успешного создания заказа корзина очищается — повторно оформить заказ из неё нельзя.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cartId
                - deliveryAddress
                - paymentMethod
              properties:
                cartId:
                  type: string
                  example: "cart_12345"
                  description: ID корзины, на основе которой создается заказ.
                deliveryAddress:
                  type: string
                  example: "г. Москва, ул. Ленина, д. 10, кв. 42"
                  description: Полный адрес доставки.
                paymentMethod:
                  type: string
                  enum: [card, sbp, cash_on_delivery]
                  example: "card"
                  description: Способ оплаты.
      responses:
        '201':
          description: Заказ успешно создан.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                    example: "ord_555444"
                  status:
                    type: string
                    enum: [CREATED, PAID, ASSEMBLING, SHIPPED, DELIVERED, CANCELLED]
                    example: "CREATED"
                  totalPrice:
                    type: integer
                    description: Итоговая стоимость заказа в копейках.
                    example: 299000
                  createdAt:
                    type: string
                    format: date-time
                    example: "2026-10-24T12:30:00Z"
        '400':
          description: Ошибка создания заказа (например, корзина пуста или товара нет в наличии).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не авторизован (требуется Bearer Token).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "JWT-токен, передаётся в заголовке Authorization: Bearer <token>."

  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки.
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: Человекочитаемое описание ошибки.
          example: "Поле 'quantity' должно быть больше 0."
